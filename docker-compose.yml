services:
  ada-mcp-gateway:
    image: ghcr.io/abg1979/mcp-nginx-proxy:latest
    container_name: ada-mcp-gateway
    ports:
      - "1980:8080"
    environment:
      - MCP_UPSTREAM_URL=${ADA_MCP_UPSTREAM_URL}
      - MCP_HEADER_X_JIRA_PAT_TOKEN=${JIRA_PAT_TOKEN}
      - MCP_HEADER_X_GITHUB_CORP_TOKEN=${GITHUB_CORP_TOKEN}
      - MCP_HEADER_X_GITHUB_CLOUD_TOKEN=${GITHUB_CLOUD_TOKEN}
      - MCP_HEADER_X_WIKI_MCP_TOKEN=${WIKI_MCP_TOKEN}
      - NGINX_ERROR_LOG_LEVEL=debug
  splunk-mcp-gateway:
    image: ghcr.io/abg1979/mcp-nginx-proxy:latest
    container_name: splunk-mcp-gateway
    ports:
      - "1981:8080"
    environment:
      - MCP_UPSTREAM_URL=${SPLUNK_MCP_UPSTREAM_URL}
      - MCP_HEADER_AUTHORIZATION=Bearer ${SPLUNK_MCP_TOKEN}
      - NGINX_ERROR_LOG_LEVEL=debug

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/litellm_config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      AZURE_FOUNDRY_API_BASE: ${AZURE_FOUNDRY_API_BASE}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY}
      AZURE_FOUNDRY_OPENAI_API_BASE: ${AZURE_FOUNDRY_API_BASE}/openai/v1
      AZURE_FOUNDRY_ANTHROPIC_API_BASE: ${AZURE_FOUNDRY_API_BASE}/anthropic
    command:
      - "--config"
      - "/app/config.yaml"
