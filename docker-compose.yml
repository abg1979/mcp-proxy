services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "1982:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - litellm-copilot-token:/root/.config/litellm
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      AZURE_FOUNDRY_API_BASE: ${AZURE_FOUNDRY_API_BASE}
      AZURE_FOUNDRY_API_KEY: ${AZURE_FOUNDRY_API_KEY}
      AZURE_FOUNDRY_OPENAI_API_BASE: ${AZURE_FOUNDRY_API_BASE}/openai/v1
      AZURE_FOUNDRY_ANTHROPIC_API_BASE: ${AZURE_FOUNDRY_API_BASE}/anthropic
    command:
      - "--config"
      - "/app/config.yaml"

volumes:
  litellm-copilot-token:
